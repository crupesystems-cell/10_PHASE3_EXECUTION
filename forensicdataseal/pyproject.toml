[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensicdataseal"
version = "0.1.0"
description = "ForensicDataSeal CLI (offline evidence sealing & verification)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
forensicdataseal = "forensicdataseal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
