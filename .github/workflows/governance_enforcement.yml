name: Governance Enforcement (Frozen Artifacts)

on:
  pull_request:
  push:

jobs:
  governance_enforcement:
    name: Governance Enforcement (Frozen Artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen governance hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f policy/governance_hashes.sha256
          sha256sum --check --strict policy/governance_hashes.sha256
